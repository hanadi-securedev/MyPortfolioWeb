<section id="contact" class="contact-section">
  <div class="section-container-narrow">
    <h2 class="section-title">Let's Connect</h2>
    <p class="section-subtitle">I'm always open to new opportunities and collaborations</p>
    
    <div class="contact-card">
      <div class="contact-grid">
        <a href="mailto:hanadi.fakir@example.com" class="contact-item">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-icon">
            <path [attr.d]="iconService.getIconPath('mail')"></path>
          </svg>
          <div class="contact-info">
            <div class="contact-title">Email</div>
            <div class="contact-desc">byhanadi4&#64;gamil.com</div>
          </div>
        </a>
        
        <a href="#" class="contact-item">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-icon">
            <path [attr.d]="iconService.getIconPath('linkedin')"></path>
          </svg>
          <div class="contact-info">
            <div class="contact-title">LinkedIn</div>
            <div class="contact-desc">Connect with me</div>
          </div>
        </a>
        
        <a href="#" class="contact-item">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-icon">
            <path [attr.d]="iconService.getIconPath('github')"></path>
          </svg>
          <div class="contact-info">
            <div class="contact-title">GitHub</div>
            <div class="contact-desc">View my code</div>
          </div>
        </a>
        
        <div class="contact-item-static">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-icon">
            <path [attr.d]="iconService.getIconPath('map-pin')"></path>
          </svg>
          <div class="contact-info">
            <div class="contact-title">Location</div>
            <div class="contact-desc">Salalah, Oman</div>
          </div>
        </div>
      </div>
      
      <div class="availability-banner">
        <div class="availability-header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path [attr.d]="iconService.getIconPath('check-circle')"></path>
          </svg>
          <span class="availability-title">Available for Opportunities</span>
        </div>
        <p class="availability-text">
          Currently seeking junior full stack developer positions and freelance projects
        </p>
      </div>
    </div>
  </div>
</section>
